<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>River Watch</title>
<style>
:root{--bg:#0b1b2b;--card:#ffffff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--teal:#0ea5a4;--ok:#16a34a;--stand:#f59e0b;--bar:#dc2626;--off:#94a3b8;--radius:16px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef3f8;color:var(--ink);padding-bottom:env(safe-area-inset-bottom,0)}
.hero{background:linear-gradient(135deg,var(--bg),#13476b 70%,#0e7490);color:#fff;padding:calc(18px + env(safe-area-inset-top,0)) 16px 56px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:26px}
h1{margin:0;font-size:22px}
.hero p{margin:2px 0 0;opacity:.8;font-size:13px}
.fetched{font-size:12px;background:rgba(255,255,255,.14);padding:6px 10px;border-radius:99px}
main{max-width:1100px;margin:-40px auto 40px;padding:0 12px;display:grid;gap:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 6px 22px rgba(15,23,42,.09);padding:14px;min-width:0}
.card h2{margin:0 0 8px;font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--mute)}
.rule{font-size:13px;background:#ecfeff;border:1px solid #a5f3fc;border-radius:12px;padding:10px 12px;color:#155e75}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:56px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 16px;min-height:44px;background:var(--teal);color:#fff;cursor:pointer}
button.ghost{background:#e2e8f0;color:#0f172a}
button:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12px;color:var(--mute)}
.hint.err{color:var(--bar)}
#chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;margin-bottom:10px}
.b{padding:10px 12px;border-radius:14px;max-width:96%;word-wrap:break-word;overflow-wrap:anywhere}
.b.user{align-self:flex-end;background:var(--teal);color:#fff;border-bottom-right-radius:4px}
.b.bot{align-self:flex-start;background:#f1f5f9;border-bottom-left-radius:4px}
.b.err{align-self:stretch;max-width:100%;background:#fef2f2;border:1px solid #fecaca;color:#7f1d1d}
.b.note{align-self:stretch;max-width:100%;background:#fffbeb;border:1px solid #fde68a;color:#78350f}
.b pre,.errlist pre{white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;margin:6px 0 0}
.stamp{font-size:11px;color:var(--mute);margin-top:6px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#64748b;animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ask{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:#e2e8f0}
.chip.good{background:#dcfce7;color:#14532d}.chip.bad{background:#fee2e2;color:#7f1d1d}.chip.warn{background:#fef3c7;color:#78350f}
button.ex{font-size:13px;font-weight:500;padding:6px 12px;min-height:36px;border-radius:99px;background:#f0fdfa;color:#115e59;border:1px solid #99f6e4}
.grid3{display:grid;gap:12px}
.panel{border-radius:var(--radius);padding:14px;color:#fff}
.panel h3{margin:0 0 2px;font-size:16px}.panel .sub{font-size:12px;opacity:.85;margin-bottom:10px}
.panel.p1{background:linear-gradient(135deg,#b45309,#f59e0b)}
.panel.p2{background:linear-gradient(135deg,#991b1b,#ef4444)}
.panel.p3{background:linear-gradient(135deg,#0c4a6e,#0ea5a4)}
.big{font-size:38px;font-weight:800;line-height:1}
.panel .tw{background:rgba(255,255,255,.16);border-radius:12px;padding:9px 10px;margin-top:8px}
.panel .tw b{display:block}.panel .tw small{opacity:.95;display:block}
.empty{opacity:.85;font-style:italic;margin-top:8px}
.tag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:99px;margin:2px 3px 0 0}
.tag.dark{background:#e2e8f0;color:#334155}.tag.rh{background:#7c3aed;color:#fff}
.tag.yel{background:#fef3c7;color:#78350f}.tag.org{background:#fed7aa;color:#7c2d12}.tag.redw{background:#fecaca;color:#7f1d1d}
.towns{display:grid;gap:10px}
.town{border:1px solid var(--line);border-left:6px solid var(--off);border-radius:12px;padding:10px 12px;min-width:0}
.town.l0{border-left-color:var(--ok)}.town.l1{border-left-color:var(--stand)}.town.l2{border-left-color:var(--bar)}
.town h4{margin:0;display:flex;justify-content:space-between;gap:8px;font-size:15px}
.town .lv{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;color:#fff;background:var(--off);white-space:nowrap;align-self:center}
.lv.l0{background:var(--ok)}.lv.l1{background:var(--stand)}.lv.l2{background:var(--bar)}
.meta{font-size:12px;color:var(--mute)}
.gauge{position:relative;height:12px;background:#e2e8f0;border-radius:99px;margin:14px 0 18px}
.gauge .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok)}
.gauge .fill.l1{background:var(--stand)}.gauge .fill.l2{background:var(--bar)}
.gauge .m{position:absolute;top:-3px;bottom:-3px;width:2px;background:#334155}
.gauge .m u{position:absolute;top:17px;left:-14px;font-size:10px;text-decoration:none;color:#475569}
.gauge.off{background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 6px,#f1f5f9 6px,#f1f5f9 12px);text-align:center;font-size:10px;color:#64748b;line-height:12px}
.reasons{font-size:12px;color:#7f1d1d;background:#fef2f2;border-radius:8px;padding:6px 8px;margin-top:6px}
.flags{font-size:12px;color:#78350f;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;color:var(--mute)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll table{min-width:520px}
.callout{background:#f0fdfa;border:1px solid #99f6e4;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.errlist .e{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:8px 10px;margin-bottom:8px;color:#7f1d1d;font-size:13px}
.log li{margin-bottom:6px;font-size:13px}
.rg th.y{background:#fef9c3;color:#713f12}.rg th.o{background:#fed7aa;color:#7c2d12}.rg th.r{background:#fecaca;color:#7f1d1d}
.disc{font-size:12px;color:#475569;margin-top:6px}
@media(min-width:760px){.grid3{grid-template-columns:repeat(3,1fr)}.towns{grid-template-columns:repeat(2,1fr)}.hero{padding:calc(24px + env(safe-area-inset-top,0)) 28px 64px}}
@media(min-width:1000px){.towns{grid-template-columns:repeat(4,1fr)}}
@media(max-width:480px){.ask{grid-template-columns:1fr}.ask button{width:100%}}
</style>
</head>
<body>
<header class="hero">
  <div class="brand"><div class="logo">≈</div><div><h1>River Watch</h1><p>Flood response advice shared by eight county councils</p></div></div>
  <div class="fetched" id="fetched">No data fetched yet</div>
</header>

<main>
  <div class="rule"><strong>River Watch recommends; it never sends a crew.</strong> The Duty Officer records the decision and the reason (decision record at the bottom).</div>

  <section class="card">
    <h2>Ask River Watch</h2>
    <div id="chat" aria-live="polite"></div>
    <div class="chips" id="ex" style="margin-bottom:8px"></div>
    <div class="ask">
